[project]
name = "zdmem"
version = "0.1.0"
description = "LLM Memory System for managing user memories with hybrid search"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "litellm>=1.50.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "json-repair>=0.30.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["memory_core*"]
